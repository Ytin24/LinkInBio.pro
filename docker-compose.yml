version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: linkinbio-postgres
    environment:
      POSTGRES_DB: linkinbio
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./LinkInBio.Backend/Database/Migrations.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./LinkInBio.Backend
      dockerfile: Dockerfile
    container_name: linkinbio-backend
    environment:
      DATABASE_URL: "Host=postgres;Database=linkinbio;Username=postgres;Password=postgres"
      JWT_SECRET: "your-super-secret-jwt-key-change-this-in-production-min-32-chars"
      PORT: 5000
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
